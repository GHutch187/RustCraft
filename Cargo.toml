[package]
name = "rustcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.0"
tokio = { version = "1", features = ["full"] }
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "3.4.2"
base64 = "0.23.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 2
